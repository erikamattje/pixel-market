<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="faixa-promocional">
            <div class="faixa-mensagem">
                <div class="mensagem">
                    ★ FRETE GRÁTIS ACIMA DE R$ 199 ★ 
                    <span> • PARCELAMENTO EM ATÉ 3X SEM JUROS •</span>
                </div>
                
                <div class="mensagem">
                    ★ FRETE GRÁTIS ACIMA DE R$ 199 ★ 
                    <span> • PARCELAMENTO EM ATÉ 3X SEM JUROS •</span>
                </div>
            </div>
            
        </div>

        <img src="images/logo-pixel-market.png">
    </header>

    <button id="carrinho"> <i data-lucide="shopping-cart"></i> 
        <span class="texto-carrinho">Carrinho</span>
        <span class="quantidade-carrinho"></span>
    </button>
    
    <input type="text" id="busca" placeholder="Busque um produto...">

    <div id="categoria">
        <button class="botao categoria">Todos</button>
        <button class="botao categoria">Jogos</button>
        <button class="botao categoria">Headsets</button>
        <button class="botao categoria">Controles</button>
        <button class="botao categoria">Acessórios</button>
    </div>

    <div id="produtos"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>
</html>
